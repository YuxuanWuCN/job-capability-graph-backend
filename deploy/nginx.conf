# 岗智融析 · 生产 nginx（同源：静态前端 + /api 反代）
# 面向 5000 人/月、峰值数百并发的取值：上游长连接 + 静态长缓存 + gzip
upstream job_graph_api {
    server 127.0.0.1:8000;
    # 与 uvicorn 保持长连接，避免每个请求新建 TCP（高并发下大量 TIME_WAIT）
    keepalive 64;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    root /var/www/job-graph/dist;
    index index.html;

    # 带 hash 的静态资源：一年缓存 + 关日志（每次首屏十来个请求，日志白写）
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 图片/图标同理
    location ~* \.(?:webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 前端 SPA 路由回退（入口不缓存，保证发版即生效）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 后端 API（同源反代，避免 CORS 与 cookie 跨站问题）
    location /api/ {
        proxy_pass http://job_graph_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 复用 upstream 长连接（必须清空 Connection 头）
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # 健康检查（探活探这里）
    location /health/ {
        proxy_pass http://job_graph_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}

# 生产覆盖层：阿里云 ECS 2核4G（3.5 GiB 可用，华东2 上海）
# 参数收紧 + 内存限额 + 共用镜像 + 自动重启 + 面向「5000 人/月、峰值并发」的并发调优
# 用法：docker compose -f compose.yaml -f deploy/compose.prod.yaml up -d --no-build
#
# 内存预算（2C / 3.5 GiB 可用）：
#   limits：postgres 600m / redis 200m / neo4j 1g / migrate 450m
#           api 700m（2 workers）/ worker 1g（2 并发）/ scheduler 200m
#   实测空载合计 ≈ 1.2 GiB，余量约 2 GiB
services:
  postgres:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 600m
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=6MB
      - -c
      - maintenance_work_mem=64MB
      # api 2 workers + celery 2 子进程 + beat，每个进程默认池 5+10=15 连接，放宽到 150 防池耗尽
      - -c
      - max_connections=150

  redis:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200m
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru

  neo4j:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    # 2 核机器上 cypher-shell 自己拉一个 JVM 就要 3s+，默认 timeout:3s 必然判失败，
    # 一旦 unhealthy 依赖它的 api 容器根本不会被创建。放宽到 20s，探活间隔 30s 降低峰值。
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u neo4j -p job_graph_dev 'RETURN 1' >/dev/null
      interval: 30s
      timeout: 20s
      retries: 20
      start_period: 60s
    environment:
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 160m
      NEO4J_dbms_memory_transaction_total_max: 256m

  migrate:
    image: job-graph-backend:latest
    build: ./backend
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 450m
    command: ["alembic", "upgrade", "head"]

  api:
    image: job-graph-backend:latest
    build: ./backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m
    # 2 个 worker：单 worker 实测 50 并发时 p50≈1.1s（吞吐上限约 42 RPS），
    # 加一个进程直接翻倍；每个 worker 常驻约 140 MiB，700m 上限留足余量。
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "*"]

  worker:
    image: job-graph-backend:latest
    build: ./backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    # 简历解析单份约 9 秒（LLM 调用为主），-c 1 时一小时只能处理约 400 份，
    # 集中上传会把队列拖到几十分钟。-c 2 把吞吐翻倍，--max-tasks-per-child 20 回收常驻 RSS。
    command: ["celery", "-A", "app.worker:celery_app", "worker", "-l", "INFO", "-c", "2", "--max-tasks-per-child", "20"]

  scheduler:
    image: job-graph-backend:latest
    build: ./backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200m
    # 保留独立 beat：每 60 秒重投卡住任务、标记僵尸任务。
    command: ["celery", "-A", "app.worker:celery_app", "beat", "-l", "INFO"]
